name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.1.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            suffix: AppleSilicon
          - triple: x86_64-apple-darwin
            suffix: Intel
    permissions:
      contents: write
    env:
      ZED_TAG: v1.10.3
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout xyra
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_1*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XCODE" ] || { echo "no Xcode found"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Clone Zed source
        run: git clone --depth 1 --branch "$ZED_TAG" https://github.com/zed-industries/zed.git zed-src

      - name: Apply Wiener brand patch
        run: ./build/patch-brand.sh "$PWD/zed-src"

      - name: Build bundle
        working-directory: zed-src
        run: ./script/bundle-mac ${{ matrix.triple }}

      - name: Package Xyra.app
        run: |
          APP="$(find "zed-src/target/${{ matrix.triple }}" -maxdepth 3 -name Xyra.app -type d | head -1)"
          [ -n "$APP" ] || { echo "Xyra.app not found"; exit 1; }
          grep -aq "Welcome to Xyra" "$APP/Contents/MacOS/zed" || { echo "brand verification failed"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Xyra-$VERSION-macOS-${{ matrix.suffix }}.zip"
          shasum -a 256 "Xyra-$VERSION-macOS-${{ matrix.suffix }}.zip" | awk '{print $1}' > "Xyra-$VERSION-macOS-${{ matrix.suffix }}.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            "Xyra-$VERSION-macOS-${{ matrix.suffix }}.zip" \
            "Xyra-$VERSION-macOS-${{ matrix.suffix }}.zip.sha256" \
            --title "Xyra $VERSION" \
            --notes "Xyra $VERSION (based on Zed $ZED_TAG). install.sh downloads this release." \
            || gh release upload "$VERSION" \
               "Xyra-$VERSION-macOS-${{ matrix.suffix }}.zip" \
               "Xyra-$VERSION-macOS-${{ matrix.suffix }}.zip.sha256" --clobber
