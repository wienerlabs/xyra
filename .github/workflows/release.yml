name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.1.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      ZED_TAG: v1.10.3
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout xyra
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone Zed source
        run: git clone --depth 1 --branch "$ZED_TAG" https://github.com/zed-industries/zed.git zed-src

      - name: Apply Wiener brand patch
        run: ./build/patch-brand.sh "$PWD/zed-src"

      - name: Build bundle
        working-directory: zed-src
        run: ./script/bundle-mac

      - name: Package Xyra.app
        run: |
          APP="$(find zed-src/target -maxdepth 4 -name Xyra.app -type d | head -1)"
          [ -n "$APP" ] || { echo "Xyra.app bulunamadı"; exit 1; }
          grep -aq "Welcome to Xyra" "$APP/Contents/MacOS/zed" || { echo "marka doğrulanamadı"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Xyra-$VERSION-macos-arm64.zip"
          shasum -a 256 "Xyra-$VERSION-macos-arm64.zip" | awk '{print $1}' > "Xyra-$VERSION-macos-arm64.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            "Xyra-$VERSION-macos-arm64.zip" \
            "Xyra-$VERSION-macos-arm64.zip.sha256" \
            --title "Xyra $VERSION" \
            --notes "Xyra $VERSION (Zed $ZED_TAG tabanlı). install.sh bu release'i indirir." \
            || gh release upload "$VERSION" \
               "Xyra-$VERSION-macos-arm64.zip" \
               "Xyra-$VERSION-macos-arm64.zip.sha256" --clobber
