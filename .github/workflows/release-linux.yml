name: release-linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.2.0)"
        required: true

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        lang: [en, tr]
    permissions:
      contents: write
    env:
      ZED_TAG: v1.10.3
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      XYRA_LANG: ${{ matrix.lang }}
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout xyra
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone Zed source
        run: git clone --depth 1 --branch "$ZED_TAG" https://github.com/zed-industries/zed.git zed-src

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo bash zed-src/script/linux
          sudo apt-get install -y imagemagick perl clang

      - name: Apply Wiener brand patch
        run: ./build/patch-brand.sh "$PWD/zed-src"

      - name: Build bundle
        working-directory: zed-src
        run: ./script/bundle-linux

      - name: Package AppImage and tarball, publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SUFFIX=""; [ "${XYRA_LANG:-en}" != "en" ] && SUFFIX="-$XYRA_LANG"
          TARBALL="$(find zed-src/target -name 'zed-*.tar.gz' -o -name 'zed-*.tar.zst' 2>/dev/null | head -1)"
          [ -n "$TARBALL" ] || { echo "no linux tarball produced"; exit 1; }
          mkdir -p extract && tar xf "$TARBALL" -C extract
          BUNDLE="$(find extract -maxdepth 2 -type d -name 'zed.app' | head -1)"
          [ -n "$BUNDLE" ] || { echo "zed.app not found in tarball"; exit 1; }

          APPDIR="Xyra.AppDir"
          mkdir -p "$APPDIR/usr"
          cp -a "$BUNDLE/." "$APPDIR/usr/"
          ln -sf zed "$APPDIR/usr/bin/xyra"
          test -f "$APPDIR/usr/libexec/zed-editor" || { echo "editor binary missing from AppDir"; exit 1; }

          convert assets/xyra-icon.png -resize 256x256 "$APPDIR/xyra.png"
          cp "$APPDIR/xyra.png" "$APPDIR/.DirIcon"

          cat > "$APPDIR/xyra.desktop" <<EOF
          [Desktop Entry]
          Name=Xyra
          Comment=The agentic code editor
          Exec=xyra %F
          Icon=xyra
          Type=Application
          Categories=Development;IDE;TextEditor;
          Terminal=false
          StartupWMClass=dev.zed.Zed
          EOF

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/libexec/zed-editor" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          APPIMAGE="Xyra-$VERSION-Linux-x64$SUFFIX.AppImage"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "$APPIMAGE"
          SIZE=$(stat -c%s "$APPIMAGE")
          [ "$SIZE" -ge $((100*1024*1024)) ] || { echo "AppImage suspiciously small: $SIZE bytes"; exit 1; }
          sha256sum "$APPIMAGE" | awk '{print $1}' > "$APPIMAGE.sha256"

          EXT="${TARBALL##*.}"
          TARDEST="Xyra-$VERSION-Linux-x64$SUFFIX.tar.$EXT"
          cp "$TARBALL" "$TARDEST"
          sha256sum "$TARDEST" | awk '{print $1}' > "$TARDEST.sha256"

          gh release upload "$VERSION" "$APPIMAGE" "$APPIMAGE.sha256" "$TARDEST" "$TARDEST.sha256" --clobber \
            || gh release create "$VERSION" "$APPIMAGE" "$APPIMAGE.sha256" "$TARDEST" "$TARDEST.sha256" \
                 --title "Xyra $VERSION" --notes "Xyra $VERSION Linux build (based on Zed $ZED_TAG)."
